name: Build PaneDeck release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix gradlew executable bit in repo
        run: |
          git config user.name "JHeyzo"
          git config user.email "jershin.cn@gmail.com"
          git update-index --chmod=+x gradlew
          if git diff --cached --quiet; then
            echo "gradlew already executable, nothing to fix."
          else
            git commit -m "[skip ci] fix gradlew executable bit"
            git push
            echo "gradlew mode fixed and pushed."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages (runner's preinstalled SDK)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/panedeck.keystore
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks /tmp/panedeck.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/panedeck-v23-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/panedeck-v23-release-signed.apk
          rm -f /tmp/panedeck.keystore

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: panedeck-v23-release-signed
          path: app/build/outputs/apk/release/panedeck-v23-release-signed.apk
          if-no-files-found: error
